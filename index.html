<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Portafogli ETF</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1, h2 { text-align: center; }
        .card { background: #f9fafb; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e5e7eb; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; justify-content: center; }
        input, select, button { padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .chart-container { position: relative; height: 450px; width: 100%; margin-top: 20px; }
        .composition-container { display: flex; gap: 20px; margin-top: 20px; }
        .composition-table { flex: 1; }
        .composition-chart { flex: 1; position: relative; height: 350px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f3f4f6; font-weight: bold; color: #374151; }
        tr:hover { background: #f9fafb; }
        td:nth-child(2) { text-align: right; font-weight: bold; color: #2563eb; }
    </style>
</head>
<body>

    <h1>Dashboard Portafogli ETF</h1>
    
    <div class="card">
        <h2>Crea un nuovo Portafoglio</h2>
        <div class="row">
            <input type="text" id="portfolioName" placeholder="Nome Portafoglio (es. Sviluppo Globale)" style="width: 60%;">
        </div>
        
        <div class="row" style="margin-bottom: 15px;">
            <label for="inputMode" style="line-height: 36px; margin-right: 10px;"><strong>Modalità Inserimento:</strong></label>
            <select id="inputMode" onchange="toggleInputMode()">
                <option value="percent">Percentuale (%)</option>
                <option value="value">Valore Economico (€)</option>
            </select>
        </div>
        
        <div id="assetsContainer">
            <div class="row asset-row">
                <input type="text" class="ticker-input" placeholder="Ticker (es. SWDA.MI)">
                <input type="number" class="weight-input" placeholder="Peso % (es. 60)">
                <span class="calc-percent" style="display:none; line-height: 34px; margin-left: 10px; width: 60px; font-weight: bold; color: #2563eb;">0%</span>
            </div>
            <div class="row asset-row">
                <input type="text" class="ticker-input" placeholder="Ticker (es. EIMI.MI)">
                <input type="number" class="weight-input" placeholder="Peso % (es. 40)">
                <span class="calc-percent" style="display:none; line-height: 34px; margin-left: 10px; width: 60px; font-weight: bold; color: #2563eb;">0%</span>
            </div>
        </div>
        
        <div class="row">
            <button onclick="addAssetRow()">+ Aggiungi Strumento</button>
            <button onclick="savePortfolio()" style="background: #10b981;">Salva Portafoglio</button>
        </div>
    </div>

    <div class="card" style="text-align: center;">
        <label for="portfolioSelect"><strong>Seleziona Portafoglio:</strong></label>
        <select id="portfolioSelect" onchange="loadPortfolioData()">
            <option value="">-- Seleziona --</option>
        </select>
        
        <div class="composition-container">
            <div class="composition-table">
                <h3 style="margin-top: 0;">Composizione Portafoglio</h3>
                <div id="compositionTable" style="text-align: left; background: white; border-radius: 4px; padding: 10px; border: 1px solid #e5e7eb;">
                    <p style="color: #999; text-align: center;"><em>Seleziona un portafoglio</em></p>
                </div>
            </div>
            <div class="composition-chart">
                <h3 style="margin-top: 0;">Distribuzione %</h3>
                <canvas id="compositionChart"></canvas>
            </div>
        </div>
        
        <h3 style="margin-top: 30px;">Andamento Portafoglio</h3>
        <div class="chart-container">
            <canvas id="etfChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>Cache ETF Locale</h2>
        <button onclick="checkCacheStatus()" style="background: #6366f1; margin-bottom: 15px;">Verifica Cache</button>
        <div id="cacheStatus" style="text-align: left; background: white; padding: 15px; border-radius: 4px; border: 1px solid #ddd;">
            <p><em>Clicca su "Verifica Cache" per vedere gli ETF salvati localmente</em></p>
        </div>
    </div>

    <script>
        let myChart;
        let compositionChart;

        // --- NUOVO: Inizializzazione Session ID Isolata per la scheda del browser ---
        if (!sessionStorage.getItem('etf_session_id')) {
            const array = new Uint32Array(4);
            window.crypto.getRandomValues(array);
            const randomId = Array.from(array, dec => dec.toString(16).padStart(8, '0')).join('-');
            sessionStorage.setItem('etf_session_id', randomId);
        }
        const sessionId = sessionStorage.getItem('etf_session_id');
        // ----------------------------------------------------------------------------

        function addAssetRow() {
            const container = document.getElementById('assetsContainer');
            const row = document.createElement('div');
            row.className = 'row asset-row';
            row.innerHTML = `
                <input type="text" class="ticker-input" placeholder="Ticker">
                <input type="number" class="weight-input" placeholder="Peso %">
            `;
            container.appendChild(row);
        }

        // AGGIORNATO: Aggiunto l'header di sessione alla chiamata POST
        // AGGIORNATO: Unisce la conversione Valore -> Percentuale con il Session ID
        async function savePortfolio() {
            const name = document.getElementById('portfolioName').value;
            if (!name) return alert("Inserisci un nome per il portafoglio");

            // Recupera la modalità di input corrente
            const mode = document.getElementById('inputMode') ? document.getElementById('inputMode').value : 'percent';
            const rows = document.querySelectorAll('.asset-row');
            const assets = [];
            let totalInput = 0;

            // 1. Raccogli i valori inseriti (Euro o Percentuali)
            rows.forEach(row => {
                const ticker = row.querySelector('.ticker-input').value.trim();
                const val = parseFloat(row.querySelector('.weight-input').value);
                
                if (ticker && !isNaN(val)) {
                    assets.push({ ticker: ticker, rawValue: val });
                    totalInput += val; // Capitale totale (se in €) o somma dei pesi (se in %)
                }
            });

            if (assets.length === 0) return alert("Inserisci almeno uno strumento");

            // 2. Calcola le distribuzioni percentuali da inviare al backend
            let totalWeight = 0;
            const finalAssets = assets.map(asset => {
                let weight = asset.rawValue;
                
                // Se siamo in modalità economica, converti in percentuale (Base 100)
                if (mode === 'value') {
                    weight = (asset.rawValue / totalInput) * 100;
                }
                
                weight = parseFloat(weight.toFixed(2)); // Arrotonda per l'API
                totalWeight += weight;
                
                return { ticker: asset.ticker, weight: weight };
            });

            // 3. Controllo tollerante (100%) per evitare blocchi sui decimali
            if (Math.abs(totalWeight - 100) > 0.1) {
                return alert(`La somma dei pesi deve essere 100%. Attuale: ${totalWeight.toFixed(1)}%`);
            }

            // 4. Invio tramite API con header per l'isolamento sessione
            try {
                const res = await fetch('/api/v1/portfolios', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Session-ID': sessionId // Identificativo della sessione corrente
                    },
                    body: JSON.stringify({ name: name, assets: finalAssets })
                });
                
                if (res.ok) {
                    alert("Portafoglio salvato! Ricaricamento lista...");
                    // Reset pulito dei campi
                    document.getElementById('portfolioName').value = '';
                    document.querySelectorAll('.ticker-input').forEach(i => i.value = '');
                    document.querySelectorAll('.weight-input').forEach(i => i.value = '');
                    if(typeof updateCalculatedPercentages === 'function') updateCalculatedPercentages();
                    
                    await fetchPortfoliosList();
                    
                    const select = document.getElementById('portfolioSelect');
                    select.value = name;
                    loadPortfolioData();
                } else {
                    const err = await res.json();
                    alert("Errore: " + err.detail);
                }
            } catch (e) {
                console.error(e);
                alert("Errore di connessione");
            }
        }

        // AGGIORNATO: Aggiunto l'header di sessione alla chiamata GET lista portafogli
        async function fetchPortfoliosList() {
            const select = document.getElementById('portfolioSelect');
            try {
                const res = await fetch('/api/v1/portfolios', {
                    headers: { 'X-Session-ID': sessionId } // Filtra i portafogli per sessione
                });
                const portfolios = await res.json();
                const currentSelection = select.value;
                
                select.innerHTML = '<option value="">-- Seleziona --</option>';
                portfolios.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p;
                    option.textContent = p;
                    select.appendChild(option);
                });
                
                if (currentSelection && portfolios.includes(currentSelection)) {
                    select.value = currentSelection;
                }
            } catch (e) {
                console.error("Errore nel caricamento dei portafogli", e);
            }
        }

        // AGGIORNATO: Aggiunto l'header di sessione alla chiamata GET composizione
        async function loadComposition(name) {
            try {
                const response = await fetch(`/api/v1/portfolios/${name}/composition`, {
                    headers: { 'X-Session-ID': sessionId }
                });
                if (!response.ok) throw new Error("Errore nel fetch composizione");
                
                const result = await response.json();
                renderComposition(result.assets);
                renderCompositionChart(result.assets);
            } catch (error) {
                console.error(error);
            }
        }

        // AGGIORNATO: Aggiunto l'header di sessione alla chiamata GET storico
        async function loadPortfolioData() {
            const name = document.getElementById('portfolioSelect').value;
            if (!name) return;
            
            loadComposition(name);
            
            try {
                const response = await fetch(`/api/v1/portfolios/${name}/history`, {
                    headers: { 'X-Session-ID': sessionId }
                });
                if (!response.ok) throw new Error("Errore nel fetch dati");
                
                const result = await response.json();
                const labels = result.data.map(item => item.Date);
                const values = result.data.map(item => item.Value);
                renderChart(labels, values, name);
            } catch (error) {
                console.error(error);
                alert("Impossibile caricare i dati del portafoglio.");
            }
        }

        function renderChart(labels, values, name) {
            const ctx = document.getElementById('etfChart').getContext('2d');
            if (myChart) { myChart.destroy(); } 

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Crescita Portafoglio (Base 100) - ${name}`,
                        data: values,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { grid: { display: false } }, y: { beginAtZero: false } }
                }
            });
        }

        function renderComposition(assets) {
            const table = document.getElementById('compositionTable');
            let html = '<table><thead><tr><th>Ticker</th><th>Peso %</th></tr></thead><tbody>';
            assets.forEach(asset => {
                html += `<tr><td><strong>${asset.ticker}</strong></td><td>${asset.weight}%</td></tr>`;
            });
            html += '</tbody></table>';
            table.innerHTML = html;
        }

        function renderCompositionChart(assets) {
            const ctx = document.getElementById('compositionChart').getContext('2d');
            if (compositionChart) { compositionChart.destroy(); }
            const colors = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#14b8a6'];
            
            compositionChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: assets.map(a => a.ticker),
                    datasets: [{
                        data: assets.map(a => a.weight),
                        backgroundColor: colors.slice(0, assets.length),
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }

        async function checkCacheStatus() {
            try {
                const response = await fetch('/api/v1/etf-cache/status');
                if (!response.ok) throw new Error("Errore nel fetch status");
                const result = await response.json();
                const statusDiv = document.getElementById('cacheStatus');
                
                if (result.cached_etfs.length === 0) {
                    statusDiv.innerHTML = '<p style="color: #666;"><strong>Nessun ETF in cache locale</strong></p>';
                } else {
                    let html = `<p><strong>ETF in cache locale (${result.total_cached}):</strong></p><ul style="margin: 10px 0;">`;
                    result.cached_etfs.forEach(etf => {
                        const sizeMB = (etf.file_size_bytes / 1024).toFixed(2);
                        html += `<li><strong>${etf.ticker}</strong> - ${sizeMB} KB</li>`;
                    });
                    html += '</ul>';
                    statusDiv.innerHTML = html;
                }
            } catch (error) {
                document.getElementById('cacheStatus').innerHTML = '<p style="color: red;">Errore nel caricamento cache</p>';
            }
        }

        fetchPortfoliosList();
        setInterval(fetchPortfoliosList, 10000);
    </script>
</body>
</html>
