<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ETF Dashboard - SWDA.MI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .chart-container { position: relative; height: 450px; width: 100%; margin-top: 30px; }
        select { padding: 8px; font-size: 16px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Andamento ETF SWDA.MI</h1>
    
    <label for="period">Seleziona Periodo:</label>
    <select id="period" onchange="loadData()">
        <option value="1mo">1 Mese</option>
        <option value="6mo">6 Mesi</option>
        <option value="1y" selected>1 Anno</option>
        <option value="5y">5 Anni</option>
        <option value="max">Tutto</option>
    </select>

    <div class="chart-container">
        <canvas id="etfChart"></canvas>
    </div>

    <script>
        let myChart;

        async function loadData() {
            const period = document.getElementById('period').value;
            const ticker = "SWDA.MI";
            
            try {
                // MODIFICA CRITICA: Usa un URL relativo anziché hardcodare l'IP
                const response = await fetch(`/api/v1/history/${ticker}?period=${period}`);
                const result = await response.json();
                
                const labels = result.data.map(item => item.Date);
                const prices = result.data.map(item => item.Close);

                renderChart(labels, prices, ticker);
            } catch (error) {
                console.error("Errore nel caricamento dati:", error);
                alert("Impossibile caricare i dati.");
            }
        }

        function renderChart(labels, prices, ticker) {
            const ctx = document.getElementById('etfChart').getContext('2d');
            
            if (myChart) { myChart.destroy(); } // Distruggi grafico precedente se esiste

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Prezzo di Chiusura ${ticker} (€)`,
                        data: prices,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0 // Nasconde i punti per rendere la linea pulita
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { display: false } },
                        y: { beginAtZero: false }
                    }
                }
            });
        }

        // Caricamento iniziale
        loadData();
    </script>
</body>
</html>
